<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ============ SEO ============
     Edit the title/description/keywords below whenever the client wants
     to change how this page shows up in Google or when shared as a link.
     Keep the title under ~60 characters and the description under ~155
     so they don't get cut off in search results. -->
<title>KefiYo | Frozen Yogurt, Açaí &amp; Matcha in Leeds</title>
<meta name="description" content="KefiYo is a frozen yogurt, açaí and matcha counter on Merrion Street, Leeds. Fresh daily, vegan options, live cultures. Open 11am–9pm every day.">
<meta name="keywords" content="frozen yogurt Leeds, froyo Leeds, açaí bowl Leeds, matcha Leeds, vegan frozen yogurt, KefiYo, dessert shop Leeds, smoothies Leeds">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.kefiyo.co.uk/">

<!-- Open Graph (Facebook, Instagram, WhatsApp, LinkedIn link previews) -->
<meta property="og:type" content="website">
<meta property="og:title" content="KefiYo | Frozen Yogurt, Açaí & Matcha in Leeds">
<meta property="og:description" content="Light, fresh and made to order. Frozen yogurt, açaí bowls, matcha and smoothies on Merrion Street, Leeds.">
<meta property="og:image" content="https://www.kefiyo.co.uk/assets/images/social-media.jpeg">
<meta property="og:url" content="https://www.kefiyo.co.uk/">
<meta property="og:site_name" content="KefiYo">
<meta property="og:locale" content="en_GB">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="KefiYo | Frozen Yogurt, Açaí & Matcha in Leeds">
<meta name="twitter:description" content="Light, fresh and made to order. Frozen yogurt, açaí bowls, matcha and smoothies on Merrion Street, Leeds.">
<meta name="twitter:image" content="https://www.kefiyo.co.uk/assets/images/social-media.jpeg">

<meta name="theme-color" content="#465b06">

<!-- ============ Favicons ============
     Add these image files to assets/images/favicon/ with these exact
     names and every browser/device icon is covered. A free generator
     like https://realfavicongenerator.net will produce all of them
     from one source logo in one go. -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
<link rel="icon" href="assets/images/favicon/favicon.ico">
<link rel="manifest" href="assets/images/favicon/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Alata&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="wrap navin">
    <a href="#" class="logo"><img src="assets/images/logo.png" alt="KefiYo" style="height:32px;width:auto;display:block"></a>
    <nav class="navlinks" id="navLinks"></nav>
    <a href="#gift" class="btn navcta" id="navCta"></a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="wrap heroin">
    <div class="herotop" id="heroTop"></div>
    <div class="herostage">
      <video autoplay muted loop playsinline
        src="assets/videos/hero-video.mp4"></video>
      <div id="heroPills"></div>
    </div>
    <div class="strip" id="heroStrip"></div>
  </div>
</section>

<!-- FLAVOURS -->
<section id="flavours">
  <div class="wrap">
    <div class="flavhead" id="flavoursHead"></div>
    <div class="flavgrid" id="flavoursGrid"></div>
  </div>
</section>

<!-- STORY BAND -->
<section id="story" class="band">
  <div class="wrap bandin">
    <div class="bandmedia">
      <video id="storyVideo" autoplay muted loop playsinline
        src="assets/videos/story-video.mp4"></video>
    </div>
    <div class="bandtext" id="storyText"></div>
  </div>
</section>

<!-- MENU (homepage teaser) -->
<section id="menu">
  <div class="wrap">
    <div class="flavhead" id="menuHead"></div>
    <div class="menubar" id="menuChips"></div>
    <div class="menu" id="menuItems"></div>
    <div class="menufoot" id="menuFoot"></div>
  </div>
</section>

<!-- INSTAGRAM -->
<section class="igsection">
  <div class="wrap">
    <div class="flavhead" id="instaHead"></div>
    <div class="igrid" id="instaGrid"></div>
    <div class="ig-follow" id="instaFollow"></div>
  </div>
</section>

<!-- GIFT CARD -->
<section id="gift">
  <div class="wrap">
    <div class="gift" id="giftCard"></div>
  </div>
</section>

<!-- FINAL CTA -->
<section class="finalcta">
  <div class="wrap final" id="finalContent"></div>
</section>

<footer>
  <div class="wrap" id="siteFooter"></div>
</footer>

<nav class="island" id="islandNav"></nav>

<!-- VINYL MUSIC PLAYER -->
<div class="vinyl-player" id="vinylPlayer">
  <div class="vinyl-disc" id="vinylDisc" role="button" aria-label="Play/pause music" tabindex="0">
    <div class="vinyl-label" id="vinylLabel"><span class="fallback">1</span></div>
    <div class="tonearm" aria-hidden="true">
      <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="4" r="3.4" fill="#1d1c11"/>
        <line x1="30" y1="4" x2="6" y2="30" stroke="#1d1c11" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="6" cy="30" r="2.2" fill="#f7c0bf"/>
      </svg>
    </div>
  </div>
  <div class="vinyl-panel">
    <div class="vinyl-meta">
      <span class="t" id="vinylTitle">Track One</span>
      <span class="a" id="vinylArtist">KefiYo Radio</span>
      <span class="a" id="vinylStatus" style="color:#f7c0bf"></span>
    </div>
    <div class="vinyl-controls">
      <button id="vinylPrevBtn" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L10 12z"/></svg>
      </button>
      <button id="vinylPlayBtn" class="play-btn" aria-label="Play/pause">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="vinylNextBtn" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l10-6z"/></svg>
      </button>
    </div>
  </div>
  <audio id="vinylAudio" preload="none"></audio>
</div>

<script src="js/content.js"></script>
<script src="js/script.js"></script>
</body>
</html>
